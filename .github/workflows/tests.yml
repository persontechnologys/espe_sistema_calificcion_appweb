name: Pruebas

# La suite se ejecuta en los dos motores: PostgreSQL (desarrollo) y MySQL 8 (producción cPanel).
on:
  push:
  pull_request:

jobs:
  tests:
    name: PHP 8.4 · ${{ matrix.db }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db: [pgsql, mysql]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: espe_test
          POSTGRES_USER: espe
          POSTGRES_PASSWORD: espe
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U espe" --health-interval 5s --health-timeout 5s --health-retries 10
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: espe_test
          MYSQL_USER: espe
          MYSQL_PASSWORD: espe
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot" --health-interval 5s --health-timeout 5s --health-retries 20

    env:
      DB_CONNECTION: ${{ matrix.db }}
      DB_HOST: 127.0.0.1
      DB_PORT: ${{ matrix.db == 'mysql' && '3306' || '5432' }}
      DB_DATABASE: espe_test
      DB_USERNAME: espe
      DB_PASSWORD: espe

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_pgsql, pdo_mysql, bcmath, intl
          coverage: none

      - name: Instalar dependencias
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Preparar entorno
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Migraciones desde base limpia
        run: php artisan migrate --force

      - name: Revertir y volver a migrar (verifica los down())
        run: php artisan migrate:refresh --force

      - name: Ejecutar pruebas
        run: php artisan test
